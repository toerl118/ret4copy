<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#f5f5f7">
  <title>RET4 Copy</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    body {
      padding:
        max(20px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin: 18px 0 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
    }

    .header p {
      margin: 8px 0 0;
      color: #6e6e73;
      font-size: 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    .field + .field {
      margin-top: 28px;
      padding-top: 28px;
      border-top: 1px solid #e5e5e5;
    }

    .label {
      color: #6e6e73;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .value {
      min-height: 36px;
      margin-bottom: 14px;
      font-size: 24px;
      line-height: 1.3;
      font-weight: 700;
      word-break: break-all;
    }

    .password {
      letter-spacing: 3px;
    }

    button {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      background: #007aff;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(.98);
      opacity: .85;
    }

    button.copied {
      background: #248a3d;
    }

    .message {
      min-height: 26px;
      margin-top: 18px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
    }

    .error {
      text-align: center;
      padding: 20px 5px;
    }

    .error-symbol {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .error h2 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .error p {
      margin: 0;
      color: #6e6e73;
      line-height: 1.5;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 380px) {
      .card { padding: 18px; }
      .value { font-size: 21px; }
    }
  </style>
</head>

<body>

<main class="container">

  <div class="header">
    <h1>RET4 Copy</h1>
    <p>Kopiera inloggningsuppgifter</p>
  </div>

  <section class="card">

    <div id="error" class="error" hidden>
      <div class="error-symbol">⚠️</div>
      <h2>Ogiltig kod</h2>
      <p>
        Inloggningsuppgifterna saknas eller kunde inte verifieras.
        Skanna NFC-taggen eller QR-koden igen.
      </p>
    </div>

    <div id="credentials" hidden>

      <div class="field">
        <div class="label">ANVÄNDARNAMN</div>
        <div id="username" class="value"></div>
        <button id="copyUsername" type="button">
          Kopiera användarnamn
        </button>
      </div>

      <div class="field">
        <div class="label">LÖSENORD</div>
        <div class="value password">••••••••••</div>
        <button id="copyPassword" type="button">
          Kopiera lösenord
        </button>
      </div>

      <div id="message" class="message"></div>

    </div>

  </section>

</main>

<script>

const SECRET_KEY = "MinHemligaKod9284";

let usernameValue = "";
let passwordValue = "";

function initialise() {

  const fragment = window.location.hash.substring(1);
  const params = new URLSearchParams(fragment);

  const key = params.get("k");
  const username = params.get("u");
  const password = params.get("p");

  if (
    key !== SECRET_KEY ||
    !username ||
    !password
  ) {
    document.getElementById("error").hidden = false;
    clearAddressBar();
    return;
  }

  usernameValue = username;
  passwordValue = password;

  document.getElementById("username").textContent = username;
  document.getElementById("credentials").hidden = false;

  clearAddressBar();
}

function clearAddressBar() {
  history.replaceState(
    null,
    "",
    window.location.pathname + window.location.search
  );
}

async function copyToClipboard(value, button, normalText) {

  try {
    await navigator.clipboard.writeText(value);
  }
  catch (error) {

    const textarea = document.createElement("textarea");

    textarea.value = value;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";

    document.body.appendChild(textarea);

    textarea.select();
    textarea.setSelectionRange(0, textarea.value.length);

    document.execCommand("copy");

    document.body.removeChild(textarea);
  }

  const message = document.getElementById("message");

  button.textContent = "✓ Kopierat";
  button.classList.add("copied");

  message.textContent =
    "Klart – klistra nu in värdet i appen.";

  setTimeout(() => {
    button.textContent = normalText;
    button.classList.remove("copied");
    message.textContent = "";
  }, 1800);
}

document
  .getElementById("copyUsername")
  .addEventListener("click", function () {

    copyToClipboard(
      usernameValue,
      this,
      "Kopiera användarnamn"
    );

  });

document
  .getElementById("copyPassword")
  .addEventListener("click", function () {

    copyToClipboard(
      passwordValue,
      this,
      "Kopiera lösenord"
    );

  });

initialise();

</script>

</body>
</html>
